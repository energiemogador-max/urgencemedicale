# Relève quotidienne des pharmacies de garde de Casablanca.
#
# La garde tourne chaque jour : une page construite hier affiche la liste
# d'hier. Cette tâche régénère le jeu de données et pousse sur main, ce qui
# déclenche le build Cloudflare et republie la page du jour.
#
# Si la collecte échoue ou passe sous le seuil, le script sort en erreur et
# rien n'est poussé : le site continue de servir le dernier relevé valide,
# que son propre script inline signale au lecteur comme n'étant pas du jour.
name: Pharmacies de garde

on:
  schedule:
    # Toutes les deux heures. C'était 05h10 et 19h10 UTC, mais GitHub lance
    # les tâches planifiées de ce dépôt avec 5 à 8 heures de retard
    # (novembre 2026) : la relève « du matin » arrivait vers 13h et la page
    # gardait la liste de la veille toute la matinée. Plus de créneaux, c'est
    # une liste fraîche quel que soit le retard. Une exécution sans
    # changement ne pousse rien et ne reconstruit pas le site.
    - cron: "40 */2 * * *"
  workflow_dispatch:
  # Une modification du script de collecte est essayée tout de suite, plutôt
  # qu'à la prochaine exécution planifiée, que GitHub lance en ce moment avec
  # 5 à 8 heures de retard (novembre 2026).
  push:
    branches: [main]
    paths:
      - scripts/scrape-pharmacies.ts
      - .github/workflows/pharmacies-garde.yml

concurrency:
  group: pharmacies-garde
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Relever les pharmacies de garde
        run: npx tsx scripts/scrape-pharmacies.ts

      - name: Pousser si la liste a changé
        run: |
          if git diff --quiet -- content/pharmacies-garde.json; then
            echo "Liste inchangée, rien à pousser."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pharmacies-garde.json
          DATE=$(node -p "require('./content/pharmacies-garde.json').casablanca.forDate")
          N=$(node -p "require('./content/pharmacies-garde.json').casablanca.entries.filter(e=>e.confirmed).length")
          git commit -m "Pharmacies de garde : relevé du $DATE ($N officines)"
          git push
